
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 650px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .chat-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bot-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-icon {
            width: 45px;
            height: 45px;
            background: white;
            color: #5b21b6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
        }

        .bot-info h2 {
            font-size: 20px;
        }

        .bot-status {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 3px;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .header-buttons button {
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }

        .header-buttons button:hover {
            background: rgba(255,255,255,0.35);
        }

        /* Chat messages */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f7f7fb;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .user .message-content {
            background: #5b21b6;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .time {
            display: block;
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.6;
        }

        /* Typing indicator */
        .typing {
            display: none;
            margin-bottom: 15px;
        }

        .typing-content {
            background: white;
            padding: 12px 16px;
            border-radius: 18px;
            width: 65px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #777;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-6px);
            }
        }

        /* Suggestions */
        .suggestions {
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            background: white;
        }

        .suggestion {
            white-space: nowrap;
            border: 1px solid #ddd;
            background: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .suggestion:hover {
            background: #f0ebff;
            border-color: #7c3aed;
        }

        /* Input */
        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            border: 1px solid #ddd;
            outline: none;
            padding: 13px 16px;
            border-radius: 25px;
            font-size: 14px;
        }

        #userInput:focus {
            border-color: #7c3aed;
        }

        #sendButton {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: #5b21b6;
            color: white;
            cursor: pointer;
            font-size: 20px;
        }

        #sendButton:hover {
            background: #4c1d95;
            transform: scale(1.05);
        }

        /* Dark mode */
        body.dark {
            background: #111827;
        }

        body.dark .chat-container {
            background: #1f2937;
        }

        body.dark .chat-box {
            background: #111827;
        }

        body.dark .bot .message-content {
            background: #1f2937;
            color: white;
        }

        body.dark .suggestions,
        body.dark .input-area {
            background: #1f2937;
        }

        body.dark .suggestion {
            background: #374151;
            color: white;
            border-color: #4b5563;
        }

        body.dark #userInput {
            background: #374151;
            color: white;
            border-color: #4b5563;
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">

        <div class="bot-info">
            <div class="bot-icon">🤖</div>

            <div>
                <h2>My AI Chatbot</h2>
                <div class="bot-status">● Online</div>
            </div>
        </div>

        <div class="header-buttons">
            <button onclick="toggleDarkMode()" title="Dark Mode">🌙</button>
            <button onclick="clearChat()" title="Clear Chat">🗑️</button>
        </div>

    </div>

    <!-- Messages -->
    <div class="chat-box" id="chatBox">

        <div class="message bot">
            <div class="message-content">
                👋 Hello! I am your chatbot.
                <br>
                How can I help you today?
                <span class="time">Now</span>
            </div>
        </div>

    </div>

    <!-- Typing -->
    <div class="typing" id="typing">
        <div class="typing-content">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <!-- Suggestions -->
    <div class="suggestions">

        <button class="suggestion" onclick="quickMessage('What is AI?')">
            🤖 What is AI?
        </button>

        <button class="suggestion" onclick="quickMessage('Tell me about Python')">
            🐍 Python
        </button>

        <button class="suggestion" onclick="quickMessage('What is HTML?')">
            🌐 HTML
        </button>

        <button class="suggestion" onclick="quickMessage('Tell me a joke')">
            😂 Joke
        </button>

    </div>

    <!-- Input -->
    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>


<script>

    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const typing = document.getElementById("typing");

    // Send message with Enter
    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });


    // Send message
    function sendMessage() {

        const message = input.value.trim();

        if (message === "") {
            return;
        }

        addMessage(message, "user");

        input.value = "";

        showTyping();

        setTimeout(function() {

            hideTyping();

            const reply = getBotReply(message);

            addMessage(reply, "bot");

        }, 800);

    }


    // Quick message
    function quickMessage(message) {

        input.value = message;

        sendMessage();

    }


    // Add message
    function addMessage(message, sender) {

        const messageDiv = document.createElement("div");

        messageDiv.className = "message " + sender;

        const contentDiv = document.createElement("div");

        contentDiv.className = "message-content";

        contentDiv.innerHTML =
            message +
            '<span class="time">' +
            getTime() +
            '</span>';

        messageDiv.appendChild(contentDiv);

        chatBox.appendChild(messageDiv);

        chatBox.scrollTop = chatBox.scrollHeight;

    }


    // Get current time
    function getTime() {

        const now = new Date();

        return now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

    }


    // Bot responses
    function getBotReply(message) {

        const text = message.toLowerCase();

        if (
            text.includes("hello") ||
            text.includes("hi") ||
            text.includes("hey")
        ) {
            return "Hello! 👋 Nice to meet you. How can I help you?";
        }

        if (text.includes("how are you")) {
            return "I am doing great! 🤖 Thanks for asking.";
        }

        if (text.includes("what is ai") || text.includes("ai kya hai")) {
            return "AI means Artificial Intelligence. It allows computers to perform tasks that normally require human intelligence. 🤖";
        }

        if (text.includes("python")) {
            return "Python is a popular programming language used for Web Development, AI, Machine Learning, Data Science and Automation. 🐍";
        }

        if (text.includes("html")) {
            return "HTML stands for HyperText Markup Language. It is used to create the structure of websites. 🌐";
        }

        if (text.includes("css")) {
            return "CSS stands for Cascading Style Sheets. It is used to design and style websites. 🎨";
        }

        if (text.includes("javascript") || text.includes("js")) {
            return "JavaScript makes websites interactive and dynamic. ⚡";
        }

        if (text.includes("github")) {
            return "GitHub is a platform where developers store, manage and share their code. You can also host websites using GitHub Pages. 🚀";
        }

        if (text.includes("joke")) {
            return "Why did the programmer quit his job? Because he didn't get arrays! 😂";
        }

        if (
            text.includes("thank") ||
            text.includes("thanks")
        ) {
            return "You're welcome! 😊";
        }

        if (
            text.includes("bye") ||
            text.includes("goodbye")
        ) {
            return "Goodbye! 👋 Have a great day!";
        }

        return "Interesting question! 🤔 I am a basic chatbot right now. Try asking me about AI, Python, HTML, CSS, JavaScript or GitHub.";

    }


    // Typing animation
    function showTyping() {
        typing.style.display = "block";
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideTyping() {
        typing.style.display = "none";
    }


    // Clear chat
    function clearChat() {

        chatBox.innerHTML = `
            <div class="message bot">
                <div class="message-content">
                    👋 Chat cleared!
                    <br>
                    How can I help you?
                    <span class="time">Now</span>
                </div>
            </div>
        `;

    }


    // Dark mode
    function toggleDarkMode() {

        document.body.classList.toggle("dark");

    }

</script>

</body>
</html>
